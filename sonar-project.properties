# SonarCloud. La organización y la clave del proyecto las pone el workflow
# (.github/workflows/analisis-estatico.yml) desde variables del repositorio.
sonar.projectName=SAST Studio
sonar.sourceEncoding=UTF-8
sonar.sources=api,sast,web/src
sonar.tests=tests,web/src/test
sonar.test.inclusions=tests/**,web/src/test/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=web/src/test/**,**/node_modules/**,**/dist/**,migrations/**,samples/**,api/challenges/data/**
# Los casos de prueba de reglas y el código de los retos (api/challenges/data) son vulnerables a propósito.
sonar.cpd.exclusions=tests/rules/cases/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
