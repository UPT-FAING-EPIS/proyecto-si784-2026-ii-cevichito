name: Release y despliegue

# Al subir una etiqueta vX.Y.Z:
#   1. corre las pruebas,
#   2. construye la imagen Docker y la publica en GitHub Container Registry (ghcr.io),
#   3. crea el release en GitHub con las notas de cambios,
#   4. despliega en Render (la infraestructura que crea infra/ con Terraform) y comprueba que
#      la aplicación responde.
#
# Configuración (Settings → Secrets and variables → Actions):
#   Secret    RENDER_DEPLOY_HOOK_URL  URL del deploy hook del servicio en Render.
#   Variable  APP_URL                 URL pública, p. ej. https://sast-studio.onrender.com
# Sin el secreto, el release se crea igual y el despliegue se salta con un aviso.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente a publicar (p. ej. v1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Acepta "v1.0.0" o "1.0.0" en la ejecución manual.
  TAG: ${{ inputs.tag && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.ref_name }}

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: La etiqueta coincide con la versión del código
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('sast/__init__.py').read()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión del código (v$version)."
            exit 1
          fi
      - name: Pruebas
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          python -m pytest -q

  imagen:
    name: Imagen Docker en ghcr.io
    needs: pruebas
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ env.TAG }}
            ${{ steps.nombre.outputs.imagen }}:latest
          labels: org.opencontainers.image.version=${{ env.TAG }}

  release:
    name: Release en GitHub
    needs: imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Imagen Docker: `%s:%s`\n\n' "${{ needs.imagen.outputs.imagen }}" "$TAG" > notas.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notas.md
          else
            gh release create "$TAG" --title "SAST Studio $TAG" --generate-notes --notes-file notas.md
          fi

  despliegue:
    name: Despliegue en Render
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ vars.APP_URL }}
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Aviso si falta el deploy hook
        if: env.HOOK == ''
        run: echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK_URL; no se despliega."
      - name: Pedir el despliegue a Render
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Render recibió el pedido de despliegue."
      # El plan gratis tarda en construir y en despertar: se espera hasta 15 minutos.
      - name: Comprobar que la aplicación responde
        if: env.HOOK != '' && env.APP_URL != ''
        run: |
          sleep 60
          for i in $(seq 1 28); do
            if curl -fsS --max-time 20 "$APP_URL/readyz"; then
              echo
              echo "La aplicación responde en $APP_URL"
              exit 0
            fi
            sleep 30
          done
          echo "::error::La aplicación no respondió en 15 minutos."
          exit 1
