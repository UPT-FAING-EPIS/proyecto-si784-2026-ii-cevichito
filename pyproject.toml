[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sast-studio"
dynamic = ["version"]
description = "Analizador estático de seguridad didáctico, con explicaciones en español y seguimiento de hallazgos entre escaneos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Motor (sast/)
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    # API (api/)
    "flask>=3.0",
    "werkzeug>=3.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "joserfc>=1.0",
    "flask-limiter[redis]>=3.8",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pip-tools>=7.4",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
sast = "sast.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sast.__version__" }

[tool.setuptools.packages.find]
include = ["sast*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ui and not sistema and not aceptacion'"
markers = [
    "aceptacion: escenarios Gherkin de aceptación (pytest-bdd) contra el servidor real",
    "sistema: pruebas de sistema por HTTP contra el servidor real (procesos separados)",
    "ui: pruebas de interfaz en un navegador real (Playwright); necesitan el servidor de pruebas",
]

# Pruebas de mutación (solo Linux/WSL o la CI): `mutmut run` y `python scripts/reporte_mutacion.py`.
# Se mutan los módulos de lógica pura que deciden qué es «el mismo» hallazgo, qué se silencia
# y qué entra de un ZIP, y se ejecutan solo las pruebas unitarias que los cubren.
[tool.mutmut]
source_paths = ["sast/", "api/"]
only_mutate = ["sast/engine/fingerprint.py", "sast/engine/context.py", "api/services/archive.py"]
also_copy = ["sast/", "api/", "migrations/", "samples/"]
pytest_add_cli_args_test_selection = ["tests/engine/", "tests/unidad/", "tests/api/test_worker.py"]
mutate_only_covered_lines = true
