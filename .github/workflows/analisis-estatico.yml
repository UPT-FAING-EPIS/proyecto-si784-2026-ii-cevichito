name: Análisis estático (SonarCloud, Semgrep y Snyk)

# Tres herramientas externas sobre el mismo código, como control de calidad y de seguridad.
# Ninguna bloquea la integración por encontrar problemas: publican sus informes como artefactos
# (y en GitHub Code scanning si el repositorio es público). Sí falla si una herramienta no puede
# ejecutarse, para que no pase inadvertido. La CI del proyecto está en ci-quality.yml.
#
# Configuración (Settings → Secrets and variables → Actions):
#   Secrets:    SONAR_TOKEN (SonarCloud) y SNYK_TOKEN (Snyk). Si falta uno, esa herramienta se
#               salta con un aviso. NUNCA escribas un token en este archivo.
#   Variables:  SONAR_ORGANIZATION y SONAR_PROJECT_KEY (si no existen, se usan los valores por
#               defecto de abajo).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      linea_base:
        description: "Escanear también el proyecto original (antes de la refactorización) para la línea base"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: analisis-${{ github.ref }}
  cancel-in-progress: true

env:
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'nestor123' }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'nestor123_sast-studio-cevichito' }}

jobs:
  sonarcloud:
    name: SonarCloud (calidad, cobertura y duplicación)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # SonarCloud usa el historial para atribuir los cambios
      - name: Aviso si falta el token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Falta el secreto SONAR_TOKEN; se omite SonarCloud."
      - uses: actions/setup-python@v5
        if: env.SONAR_TOKEN != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Raíz como única fuente + include: así coverage.xml da rutas como "api/__init__.py". Con
      # source = sast,api salían relativas a cada paquete ("__init__.py") y SonarCloud no podía
      # resolverlas ("ambiguity, the file exists in several sources").
      - name: Pruebas con cobertura (coverage.xml para SonarCloud)
        if: env.SONAR_TOKEN != ''
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          printf '[run]\nrelative_files = True\nsource = .\ninclude =\n    sast/*\n    api/*\n' > .coveragerc
          python -m pytest -q --cov --cov-config=.coveragerc --cov-report=xml
      - name: Análisis SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
        # Esperamos al Quality Gate para que el reporte lea datos ya procesados, pero sin bloquear.
        continue-on-error: true

  semgrep:
    name: Semgrep CE (reglas públicas)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Imagen oficial con versión fija: instalado con pip en Python 3.12 falla al importar
      # pkg_resources. samples/ y tests/rules/cases/ son código vulnerable a propósito.
      # Sin --error, Semgrep sale con 0 aunque haya hallazgos: otro código es un fallo real.
      - name: Escanear
        run: |
          for fmt in sarif json; do
            docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.100.0 \
              semgrep scan --config p/default --metrics=off \
              --exclude samples --exclude tests/rules/cases \
              --$fmt --output semgrep.$fmt .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep
          path: semgrep.*
      - name: Subir a Code scanning (solo repos públicos)
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  snyk:
    name: Snyk (dependencias, código e imagen Docker)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si falta el token
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::Falta el secreto SNYK_TOKEN; se omite Snyk."
      - uses: actions/setup-python@v5
        if: env.SNYK_TOKEN != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: "22"
      - name: Instalar Snyk CLI y dependencias a analizar
        if: env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@1
          pip install -r requirements.lock
          (cd web && npm ci --no-audit --no-fund)
      # Código de salida de Snyk: 0 sin problemas, 1 encontró vulnerabilidades (se informa, no
      # bloquea), 2 o más es un error de la herramienta (falla el paso para que se vea).
      - name: Dependencias de Python
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=requirements.lock --package-manager=pip --command=python --json-file-output=snyk-python.json || [ $? -eq 1 ]
      - name: Dependencias de la web (npm)
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=web/package-lock.json --json-file-output=snyk-web.json || [ $? -eq 1 ]
      - name: Snyk Code (análisis estático)
        if: env.SNYK_TOKEN != ''
        run: snyk code test --sarif-file-output=snyk-code.sarif || [ $? -eq 1 ]
      - name: Imagen Docker
        if: env.SNYK_TOKEN != ''
        run: |
          docker build -t sast-studio:snyk .
          snyk container test sast-studio:snyk --file=Dockerfile --json-file-output=snyk-container.json || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        if: env.SNYK_TOKEN != ''
        with:
          name: snyk
          path: snyk-*

  # Junta los tres resultados en un solo reporte (resumen de la ejecución + artefacto).
  reporte:
    name: Reporte de hallazgos
    needs: [sonarcloud, semgrep, snyk]
    if: always()
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: resultados
      - name: Armar el reporte
        run: |
          python scripts/reporte_calidad.py \
            --semgrep resultados/semgrep/semgrep.json \
            --snyk-dir resultados/snyk \
            --sonar-key "${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY || '' }}" \
            --base docs/calidad/linea-base \
            --salida reporte-calidad.md
      - uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad
          path: reporte-calidad.md

  # Solo a mano: escanea el proyecto original con las mismas herramientas. Sus resultados se
  # guardan en docs/calidad/linea-base/ y sirven para contar los hallazgos superados.
  linea_base:
    name: Línea base (proyecto original)
    if: github.event_name == 'workflow_dispatch' && inputs.linea_base
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gs2018062254-sudo/Proyecto-Calidad
          ref: 4d49449585862cb317976ca4b3ee5b5f1a0e0630
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.100.0 \
            semgrep scan --config p/default --metrics=off \
            --exclude samples --exclude tests --json --output semgrep.json .
      - uses: actions/setup-python@v5
        if: env.SNYK_TOKEN != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: "22"
      - name: Snyk
        if: env.SNYK_TOKEN != ''
        run: |
          npm install -g snyk@1
          pip install -r requirements.txt
          (cd web && npm ci --no-audit --no-fund)
          snyk test --file=requirements.txt --package-manager=pip --command=python --json-file-output=snyk-python.json || [ $? -eq 1 ]
          snyk test --file=web/package-lock.json --json-file-output=snyk-web.json || [ $? -eq 1 ]
          snyk code test --sarif-file-output=snyk-code.sarif || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: linea-base
          path: |
            semgrep.json
            snyk-*
